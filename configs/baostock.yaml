data:
  source: baostock
  update_mode: incremental
  end_date: null  # null表示每次运行到当天/数据源最新可用交易日
  initial_calendar_days: 800
  frequency: d
  adjustflag: "1"  # 后复权；适合稳定追加，不会每日整体重写缓存
  universe: current_zz500
  raw_dir: data/raw/baostock_daily
  processed_file: data/processed/baostock_daily.parquet

universe:
  min_listed_days: 120
  exclude_st: true
  exclude_suspended: true
  min_amount: 10000000
  require_known_status: true
  # 首次滚动窗口使用当前成分回填；逐日快照从首次运行起积累。
  require_index_membership: false
