project:
  random_seed: 42
  output_dir: reports/generated/daily_factor_lab

data:
  source: baostock
  # 长历史负责跨周期检验；正式评价从2016年开始，2015年作为滚动因子预热期。
  history_start_date: "2015-01-01"
  research_start_date: "2016-01-01"
  membership_frequency: "W-FRI"
  initial_calendar_days: 800
  raw_dir: data/raw/baostock_daily
  processed_file: data/processed/baostock_daily.parquet
  max_stale_trading_days: 1
  required_latest_coverage: 0.98

universe:
  preferred_index: "000905.SH"
  min_listed_days: 120
  exclude_st: true
  exclude_suspended: true
  min_amount: 10000000
  require_known_status: true

factors:
  forward_periods: 5
  minimum_valid_factors: 8
  minimum_factor_coverage: 0.80
  winsor_n_mad: 5.0
  neutralize_size: false
  neutralize_industry: false
  groups: 5
  definitions:
    - {name: momentum_20_5, direction: 1.0}
    - {name: momentum_60_5, direction: 1.0}
    - {name: momentum_120_20, direction: 1.0}
    - {name: reversal_5, direction: 1.0}
    - {name: reversal_20, direction: 1.0}
    - {name: volatility_20, direction: -1.0}
    - {name: volatility_60, direction: -1.0}
    - {name: amihud_20, direction: -1.0}
    - {name: turnover_mean_20, direction: -1.0}
    - {name: amount_momentum_20, direction: 1.0}
    - {name: price_volume_corr_20, direction: 1.0}

portfolio:
  # 每日仍会计算信号；W-FRI只决定是否生成调仓单。改为D即可每日检查调仓。
  rebalance_frequency: W-FRI
  top_n: 20
  exit_rank: 30
  max_weight: 0.05

backtest:
  initial_cash: 1000000
  commission_rate: 0.0003
  stamp_duty_rate: 0.0005
  # 2023-08-28起证券交易印花税减半；扩展旧数据时必须按日期计算。
  historical_stamp_duty_rate: 0.001
  stamp_duty_change_date: "2023-08-28"
  transfer_fee_rate: 0.00001
  slippage_bps: 5.0
  minimum_commission: 5.0
  lot_size: 100

paper_account:
  state_file: data/state/paper_portfolio.json
  next_orders_file: reports/generated/daily_factor_lab/next_day_orders.csv

validation:
  train_years: 5
  validation_years: 1
  test_years: 1
  step_years: 1
  embargo_trading_days: 5
  recent_ic_windows: [63, 126, 252, 756, 1260]
  live_start_date: "2026-09-10"
