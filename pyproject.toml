[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-factor-lab"
version = "0.1.0"
description = "A reproducible A-share factor research and machine-learning workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
data = ["pyarrow>=14", "tushare>=1.4", "python-dotenv>=1.0", "duckdb>=1.0"]
free-data = ["baostock>=0.9.3", "pyarrow>=14"]
ml = ["scikit-learn>=1.3", "lightgbm>=4.0"]
dl = ["torch>=2.2"]
plot = ["matplotlib>=3.8", "seaborn>=0.13"]
dev = ["pytest>=8.0", "ruff>=0.6"]
all = [
  "pyarrow>=14", "baostock>=0.9.3", "tushare>=1.4", "python-dotenv>=1.0", "duckdb>=1.0",
  "scikit-learn>=1.3", "lightgbm>=4.0", "matplotlib>=3.8",
  "seaborn>=0.13", "torch>=2.2", "pytest>=8.0", "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
